<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Squircle badge -->
  <rect width="100" height="100" rx="22" fill="#1b2027"/>

  <!-- Spokes: hub to each satellite -->
  <line x1="50" y1="50" x2="50" y2="23" stroke="#62a0ea" stroke-width="7" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="70" y2="71" stroke="#62a0ea" stroke-width="7" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="30" y2="71" stroke="#62a0ea" stroke-width="7" stroke-linecap="round"/>

  <!-- Hub -->
  <circle cx="50" cy="50" r="15" fill="#f5f6f7"/>

  <!-- Satellites: develop / activity / security -->
  <circle cx="50" cy="23" r="9" fill="#26a269"/>
  <circle cx="70" cy="71" r="9" fill="#9141ac"/>
  <circle cx="30" cy="71" r="9" fill="#e66100"/>
</svg>
