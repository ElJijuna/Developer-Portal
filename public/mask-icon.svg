<svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Safari recolors this via the <link rel="mask-icon" color="..."> attribute using
       shape alpha only — no background rect, single implied color. -->
