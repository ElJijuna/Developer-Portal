  <line x1="50" y1="50" x2="70" y2="71" stroke="#000" stroke-width="7" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="30" y2="71" stroke="#000" stroke-width="7" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="15" fill="#000"/>
  <circle cx="50" cy="23" r="9" fill="#000"/>
  <circle cx="70" cy="71" r="9" fill="#000"/>
  <circle cx="30" cy="71" r="9" fill="#000"/>
</svg>
